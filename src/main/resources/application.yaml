spring:
  application:
    name: personal-knowledge-base

  config:
    import: optional:file:.env[.properties]

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/personal_knowledge_base}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update

  ai:
    model:
      chat: none
      embedding: openai
    openai:
      api-key: ${SILICONFLOW_API_KEY:replace-with-your-api-key}
      base-url: ${SILICONFLOW_BASE_URL:https://api.siliconflow.cn/v1}
      embedding:
        model: ${EMBEDDING_MODEL:BAAI/bge-m3}
    vectorstore:
      pgvector:
        initialize-schema: true
        schema-name: public
        table-name: vector_store
        dimensions: ${EMBEDDING_DIMENSIONS:1024}
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        remove-existing-vector-store-table: false

server:
  port: 8080

app:
  rag:
    top-k: 5
    similarity-threshold: 0.55
  chunk:
    max-chars: 500
    overlap-chars: 50
  web:
    connect-timeout-seconds: 5
    request-timeout-seconds: 10
    max-content-bytes: 2097152
