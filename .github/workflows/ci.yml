name: CI

on:
  push:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test-and-package:
    name: Test and package
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: personal_knowledge_base
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d personal_knowledge_base"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DB_URL: jdbc:postgresql://localhost:5432/personal_knowledge_base
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      SILICONFLOW_API_KEY: ci-placeholder-key

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Test and package
        run: mvn --batch-mode clean verify

      - name: Upload application package
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: personal-knowledge-base
          path: target/*.jar
          if-no-files-found: error
          retention-days: 7
